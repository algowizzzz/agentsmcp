<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run · jsonflow</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/common.js" defer></script>
<script src="/static/graph.js" defer></script>
<script src="/static/run.js" defer></script>
</head>
<body class="builder">
<header class="topbar">
  <a class="brand" href="/app" aria-label="Back to agents"><span class="brand-mark">{ }</span></a>
  <a href="/app" class="small">Agents</a><span class="muted" aria-hidden="true">/</span>
  <a id="agent-link" class="small" href="#"></a><span class="muted" aria-hidden="true">/</span>
  <b>Run</b> <span id="run-id" class="mono small muted"></span>
  <span id="run-status"></span>
  <div class="grow"></div>
  <span id="run-stats" class="row small"></span>
  <a id="btn-edit" class="btn small" href="#">Open builder</a>
  <button id="btn-rerun" class="btn primary small" type="button">Run again</button>
</header>
<div class="workspace">
  <aside class="palette" aria-label="Trace">
    <div style="padding:14px 14px 8px" class="row"><b>Trace</b><div class="grow"></div><span class="small muted">execution order</span></div>
    <div id="trace" class="palette-list" style="padding:0 8px 12px"></div>
  </aside>
  <div id="canvas" class="canvas-wrap" aria-label="Run graph"><div id="world" class="world"></div></div>
  <aside class="inspector" aria-label="Details">
    <div id="insp-head" class="insp-head"></div>
    <div id="insp-body" class="insp-body"></div>
  </aside>
</div>
</body>
</html>
